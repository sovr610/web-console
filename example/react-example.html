<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WebConsole – React Example</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f11;
            color: #e4e4e7;
            min-height: 100vh;
            padding: 20px 16px 340px;
        }
        header { text-align: center; padding: 24px 0 16px; }
        header h1 {
            font-size: clamp(18px, 5vw, 26px);
            font-weight: 700;
            background: linear-gradient(135deg, #61dafb, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p { color: #71717a; font-size: 13px; margin-top: 6px; }

        .card {
            max-width: 520px;
            margin: 16px auto;
            padding: 16px;
            background: #1c1c22;
            border: 1px solid #27272a;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            color: #a1a1aa;
        }
        .card code {
            background: #27272a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #e4e4e7;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            max-width: 520px;
            margin: 16px auto;
        }
        .demo-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 8px;
            background: #1c1c22;
            border: 1px solid #27272a;
            border-radius: 10px;
            color: #d4d4d8;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s, transform .1s;
            -webkit-tap-highlight-color: transparent;
        }
        .demo-btn:active { transform: scale(.96); }
        .demo-btn:hover { background: #27272a; }
        .demo-btn .icon { font-size: 20px; }

        .section-label {
            max-width: 520px;
            margin: 20px auto 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #52525b;
            padding-left: 4px;
        }

        #react-app { max-width: 520px; margin: 0 auto; }
    </style>
</head>
<body>

<header>
    <h1>&#x269B; React + WebConsole</h1>
    <p>React 18 wrapper component demo</p>
</header>

<div class="card">
    This page loads the vanilla <code>WebConsole</code> bundle, then mounts a React 18
    app that uses the <code>&lt;WebConsole /&gt;</code> wrapper component.
    The component exposes <code>show</code>, <code>hide</code>, <code>toggle</code>,
    <code>clearConsole</code>, <code>addCustomTab</code>, and <code>addCustomMessage</code> via <code>ref</code>.
</div>

<div id="react-app"></div>

<!-- 1. Vanilla WebConsole (attaches window.WebConsole) -->
<script src="../src/new-webConsole.js"></script>

<!-- 2. React from CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- 3. Demo app (uses React globals — no JSX transform needed, just createElement) -->
<script>
    const { useState, useRef, useEffect, useCallback } = React;
    const e = React.createElement;

    // ── Thin inline wrapper (mirrors the built component logic) ──
    function WebConsoleComponent(props) {
        const wcRef = useRef(null);

        useEffect(() => {
            const WC = window.WebConsole;
            if (!WC) return;
            const inst = new WC(props.containerId || 'web-console');
            wcRef.current = inst;
            if (props.onReady) props.onReady(inst);
            return () => { inst.destroy(); wcRef.current = null; };
        }, []);

        return null; // vanilla class manages its own DOM
    }

    // ── Demo App ────────────────────────────────────────────────
    function App() {
        const wcInstance = useRef(null);
        const [ready, setReady] = useState(false);

        const onReady = useCallback((inst) => {
            wcInstance.current = inst;
            setReady(true);
            console.info('[React] WebConsole mounted via React wrapper ✓');
        }, []);

        const btn = (icon, label, fn) =>
            e('button', { className: 'demo-btn', onClick: fn, key: label },
                e('span', { className: 'icon' }, icon),
                label
            );

        return e('div', null,
            e(WebConsoleComponent, { onReady }),

            e('div', { className: 'section-label' }, 'Console output'),
            e('div', { className: 'demo-grid' },
                btn('\u{1F4AC}', 'Log message', () => {
                    console.log('Hello from React!', { framework: 'React', version: 18 });
                }),
                btn('\u26A0\uFE0F', 'Warning', () => {
                    console.warn('React StrictMode double-render detected in dev');
                }),
                btn('\u{1F6A8}', 'Error', () => {
                    console.error('Unhandled promise rejection in useEffect');
                }),
                btn('\u2139\uFE0F', 'Info', () => {
                    console.info('React hydration complete — 24 components rendered');
                })
            ),

            e('div', { className: 'section-label' }, 'Component API via ref'),
            e('div', { className: 'demo-grid' },
                btn('\u{1F4E6}', 'Log object', () => {
                    console.log('React state:', {
                        user: { id: 42, name: 'Jane' },
                        cart: [
                            { product: 'Widget', qty: 2, price: 9.99 },
                            { product: 'Gadget', qty: 1, price: 24.50 }
                        ],
                        session: { token: 'eyJhbGci...', expiresIn: 3600 }
                    });
                }),
                btn('\u{2795}', 'Custom tab', () => {
                    if (!wcInstance.current) return;
                    wcInstance.current.addCustomTab('React');
                    wcInstance.current.addCustomMessage('React', '⚛️  Component rendered 12 times', { color: '#61dafb', fontWeight: 'bold' });
                    wcInstance.current.addCustomMessage('React', '🧩 Props received: { visible: true, theme: "dark" }', { color: '#a1a1aa' });
                    wcInstance.current.addCustomMessage('React', '📊 State updates: 5 (batched: 3)', { color: '#cca700' });
                    console.info('Custom "React" tab created →');
                }),
                btn('\u{1F441}', 'Toggle', () => wcInstance.current?.toggle()),
                btn('\u{1F9F9}', 'Clear', () => wcInstance.current?.clearConsole())
            ),

            e('div', { className: 'section-label' }, 'Network'),
            e('div', { className: 'demo-grid' },
                btn('\u{1F310}', 'Fetch users', () => {
                    fetch('https://jsonplaceholder.typicode.com/users')
                        .then(r => r.json())
                        .then(users => console.log(`Fetched ${users.length} users:`, users.slice(0, 3)))
                        .catch(err => console.error('Fetch failed:', err));
                }),
                btn('\u{1F4E8}', 'POST data', () => {
                    fetch('https://jsonplaceholder.typicode.com/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: 'React example', body: 'Sent from React wrapper demo', userId: 1 })
                    })
                    .then(r => r.json())
                    .then(data => console.log('POST response:', data))
                    .catch(err => console.error('POST failed:', err));
                })
            )
        );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('react-app'));
    root.render(e(App));
</script>
</body>
</html>
